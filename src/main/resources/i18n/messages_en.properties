# ── ServiceError meanings on control rejections ──────────────────────────────
ctl.svcerr.1=The object is not available on the IED. Check that the reference exists and that the model is up to date.
ctl.svcerr.2=The object is in use. Another command may be running or another client may hold a selection.
ctl.svcerr.3=The IED denied access. On a control command this is usually interlocking, command authority or an object block. Use Check conditions to see which one applies.
ctl.svcerr.4=The command is not allowed in the object present state. Check the logical node mode and the present device position.
ctl.svcerr.5=Some command parameter is not acceptable to the IED. Check the commanded value and the command level.
ctl.svcerr.6=The command parameters are inconsistent with each other. Under SBO, the OPERATE must repeat exactly the origin and ctlVal of the SELECT.
ctl.svcerr.7=The IED does not support this service class on the object.
ctl.svcerr.8=Another client holds the object reserved. Wait for it to release the selection or for its timeout to expire.
ctl.svcerr.9=The object requires a prior selection: send SELECT before OPERATE.
ctl.svcerr.10=Type conflict: the value sent does not match the type declared in the model.
ctl.svcerr.11=The service failed due to a communications constraint.
ctl.svcerr.12=The server rejected the command due to its own constraint. Check the device log.
ctl.svcerr.13=The IED application is unreachable.
ctl.svcerr.14=The connection was lost during the operation.
ctl.svcerr.22=The IED did not respond within the timeout.
ctl.diag.fallback=(the IED published no AddCause; this is the ServiceError reading, which is more generic)

